name: Build and deploy production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and complete feed history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned Zola
        run: bash scripts/install-zola.sh
      - name: Check content and internal links
        run: python3 scripts/site.py check --zola .cache/bin/zola --skip-external-links
      - name: Build for the canonical domain
        run: python3 scripts/site.py build --zola .cache/bin/zola --base-url https://jmporch.com
      - name: Verify portfolio feed history and identities
        run: python3 -m unittest discover -s tests -v
      - name: Verify production output and blog integration
        run: python3 scripts/verify_site.py --zola .cache/bin/zola --base-url https://jmporch.com
      - name: Record the source commit and release
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          DEPLOY_RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path('public/deployment.json').write_text(json.dumps({
              'commit': os.environ['SOURCE_COMMIT'],
              'release': os.environ['DEPLOY_RELEASE'],
          }) + '\n')
          PY
      - name: Upload checked production files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-site
          path: public
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy and verify (${{ matrix.target }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: old
            script: scripts/deploy-production.sh
            host_var: SSH_HOST
            port_var: SSH_PORT
            user_var: SSH_USER
            known_hosts_var: SSH_KNOWN_HOSTS
            key_secret: SSH_PRIVATE_KEY
            url: https://jmporch.com
          - target: new
            script: scripts/deploy-release.sh
            host_var: NEW_SSH_HOST
            port_var: NEW_SSH_PORT
            user_var: NEW_SSH_USER
            known_hosts_var: NEW_SSH_KNOWN_HOSTS
            key_secret: SSH_PRIVATE_KEY_NEW
            url: https://test.jmporch.com
    environment:
      name: production
      url: https://jmporch.com
    steps:
      - name: Check out the deployment script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python for deployment checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate fixed migration targets
        env:
          OLD_SERVER_IP: ${{ vars.SSH_HOST }}
          NEW_SERVER_IP: ${{ vars.NEW_SSH_HOST }}
        run: |
          python3 - <<'PY'
          import ipaddress
          import os
          old = ipaddress.IPv4Address(os.environ['OLD_SERVER_IP'])
          new = ipaddress.IPv4Address(os.environ['NEW_SERVER_IP'])
          if old == new:
              raise SystemExit('Old and new deployment targets must be different fixed IPs.')
          PY
      - name: Download checked production files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-site
          path: public
      - name: Sync and verify production files
        env:
          SSH_HOST: ${{ vars[matrix.host_var] }}
          SSH_PORT: ${{ vars[matrix.port_var] }}
          SSH_USER: ${{ vars[matrix.user_var] }}
          SSH_KNOWN_HOSTS: ${{ vars[matrix.known_hosts_var] }}
          SSH_PRIVATE_KEY: ${{ secrets[matrix.key_secret] }}
          DEPLOY_RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_SCRIPT: ${{ matrix.script }}
        run: bash "$DEPLOY_SCRIPT" public
      - name: Verify this server over HTTPS
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          DEPLOY_RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_TARGET: ${{ matrix.target }}
          CHECK_BASE_URL: ${{ matrix.url }}
          CHECK_IP: ${{ vars[matrix.host_var] }}
        run: |
          args=()
          if [[ "$DEPLOY_TARGET" == new ]]; then
            args+=(--require-noindex --check-haywire)
          fi
          python3 scripts/check_deployment.py \
            --base-url "$CHECK_BASE_URL" \
            --connect-ip "$CHECK_IP" \
            --commit "$SOURCE_COMMIT" \
            --release "$DEPLOY_RELEASE" \
            --artifact public "${args[@]}"
