[[groups.items]]
id = "sheathing-the-sword"
label = "Sheathing the Sword: Akira Kurosawa and the Virtue of Meekness | <cite>Christ and Pop Culture</cite>"
url = "https://christandpopculture.com/sheathing-sword-akira-kurosawa-virtue-meekness/"
feed_title = "Christ and Pop Culture | Sheathing the Sword: Akira Kurosawa and the Virtue of Meekness"
guid = "https://christandpopculture.com/sheathing-sword-akira-kurosawa-virtue-meekness/"
description = "An in-depth meditation on the oft-misunderstood virtue of meekness, specifically as presented by the samurai films of Akira Kurosawa. Toshiro Mifune, playing the title role in Sanjuro, is called a \"sword without a sheath\" for his inclination toward violence, and the movie presents a vision of violence as a sword kept safely in its sheath. Christians, however, look forward to a deeper kind of peace where the swords themselves are beaten to plowshares, turning weapons of war into tools of nurturing. Featured article at Christ and Pop Culture, January 2018 issue."
feed_date = 2018-02-05T20:00:00Z
